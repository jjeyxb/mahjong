# Majsoul Copilot 預設設定
#
# 個人機器上的覆寫請寫在 config/default.local.yaml(不進版控),
# 該檔會以遞迴合併的方式蓋過本檔。
#
# 注意:設定模型設了 extra="forbid",鍵名打錯會直接報錯而不是被默默忽略。

log_level: INFO

capture:
  # auto 會依平台挑選 macos / windows,失敗時退回 mss
  backend: auto

  # macOS 專用。true 取完整 backing-store 像素(Retina 下為 2 倍解析度)。
  # 實測 2x 擷取約 10.6 ms/frame(94 fps),對 15 fps 的目標綽綽有餘,
  # 而多出來的解析度對模板比對精度有實質幫助,故預設開啟。
  retina: true

  target_fps: 15.0

  window:
    # 程式名稱(owner)的權重高於視窗標題,因為標題含使用者內容,容易假陽性
    # —— 實測 VS Code 開著檔名含「雀魂」的檔案時,標題就會命中且視窗比遊戲大。
    owner_patterns:
      - 雀魂          # macOS / Windows Steam 客戶端的程式名
      - majsoul
      - jantama
    title_patterns:
      - 雀魂
      - majsoul
      - maj-soul
    min_width: 640
    min_height: 360

calibration:
  # --- 邊框剝除 ---
  # 從四邊往內剝掉「整條顏色一致」的帶狀區域,同時處理三種東西:
  #   1. 作業系統視窗裝飾(macOS 標題列實測 Retina 下為 56 px)
  #   2. 遊戲補的黑邊(letterbox / pillarbox)
  #   3. 瀏覽器的分頁列與網址列
  border_tolerance: 20      # 與該邊參考色的通道差異上限
  border_uniformity: 0.7    # 一行/列要有此比例像素同色才剝除
  max_peel_ratio: 0.4       # 單方向最多剝掉的尺寸比例(整張同色時的煞車)
  min_content_ratio: 0.3    # 剝完至少要保留原影像這個比例的面積

  # --- 比例檢查 ---
  aspect_ratio: 1.7777777778   # 雀魂畫布的設計比例 16:9
  aspect_tolerance: 0.03

  # 偏離時是否強制置中裁切成 16:9。預設關閉。
  # 實測 macOS Steam 版雀魂會把畫面撐滿視窗內容區(量到 1.796 而非 1.778),
  # 這種情況下強制裁切反而會讓所有 ROI 偏移。
  enforce_aspect: false

  # 自動偵測失敗時的逃生門:手動指定牌桌矩形,
  # 格式為相對於「視窗影像」的正規化 [x, y, w, h]。
  # 可用 tools/capture_probe.py --calibrate 產生的標註圖來對照調整。
  manual_table_rect: null

# 牌桌各區域的 ROI,座標一律相對 calibration 算出的 table_rect 正規化 [x, y, w, h]。
#
# 用「螢幕方位」命名(kamicha/toimen/shimocha),不是「實際座位風」——雀魂的
# 攝影機視角永遠讓自己在畫面最下方,上家/對面/下家對應的螢幕位置每局都固定。
#
# river / melds 是外框,不是逐張子格:框內實際有幾張牌、切到哪裡停,是 M3
# 掃描時該解決的問題,不該在 ROI 定義階段就假設好結構。
#
# 牌河**最多就是三列**(每列 6 張),不會有第四列 —— 現有的 river 框剛好
# 容納三列就夠,不需要額外留高度。
#
# 量測方式(2026-07-27,tools/roi_annotate.py 手動拉框):
# 底圖是 tools/roi_union.py 疊出來的極值圖 data/roi_ref/extent.png ——
# 一局完整錄影(216 幀)加上同一牌局四個視角的截圖(東4局剩 14 張,逼近流局,
# 牌河已疊到第三列、有四組副露),取聯集後標出每個區域最遠能長到哪裡。
# 四張截圖的自動校正被 replay 播放器的 OFF 徽章干擾,高度少了 10~43 px,
# 已用整圖比對確認是「左上對齊、僅底部被截」後補回 2560x1440 再疊。
#
# 有兩處刻意的重疊,不是錯誤:
#   - own_hand 與 own.melds —— 手牌靠左生長、副露靠右生長,副露越多手牌越短,
#     兩者會共用中間那段。極值分別是滿手 13 張(右緣 0.757)與四組副露
#     (左緣 0.411)。
#   - own_hand 與 kamicha.melds —— 畫面左下角這兩區真的相鄰。
roi:
  own:
    river: [0.3950, 0.5007, 0.2025, 0.2015]
    melds: [0.4108, 0.8711, 0.5392, 0.0948]
  # 自己的手牌外框,含摸進來的第 14 張。對手手牌永遠蓋牌,不需要這個欄位。
  #
  # 右緣 0.823 的來源:另外補拍一張「輪到自己、手上 14 張、無副露」的畫面
  # (data/roi_ref/angles/a5_hand14.png),整理好的 13 張到 0.757,摸的那張
  # 空一格後落在 [0.774, 0.822]。
  #
  # 摸牌那張**不能**獨立成一個 ROI:它緊接在暗手牌右側,而暗手牌長度隨副露
  # 數改變 —— 無副露時它在 x≈0.78,四組副露時手上只剩 1 張,它就跑到
  # x≈0.19。沒有固定座標可框,只能用一個涵蓋整段的外框,由 M3 掃描層在框內
  # 找牌,並用那個空隙判斷哪張是剛摸的(對應 MJAI 的 tsumo)。
  own_hand: [0.1150, 0.8533, 0.7083, 0.1437]
  kamicha:         # 上家,螢幕左側(副露在下方,靠近自己這側)
    river: [0.2683, 0.2667, 0.1383, 0.2504]
    melds: [0.0325, 0.2681, 0.1492, 0.6281]
  toimen:          # 對面,螢幕上方
    river: [0.4167, 0.1437, 0.1692, 0.1452]
    melds: [0.2058, 0.0311, 0.3550, 0.0563]
  shimocha:        # 下家,螢幕右側(副露在上方)
    river: [0.5883, 0.2696, 0.1408, 0.2370]
    melds: [0.7825, 0.0370, 0.1175, 0.4785]
  # 左上角那塊面板整塊。**不只寶牌指示器** —— 量測時刻意把下面那排
  # 「立直棒 ×N」「本場棒 ×N」的計數也框了進來,因為供託與本場數同樣是
  # tracker 需要的狀態,而且就緊貼在寶牌下方,分成兩個 ROI 沒有好處。
  # 上半是 5 個寶牌槽(1 張起始 + 最多 4 張槓寶),下半約 1/3 高度是那兩個計數。
  dora_indicators: [0.0133, 0.0385, 0.1475, 0.1319]
  # 中央 HUD 整塊:局數、余牌數、四家點數,以及四角的座位風標記
  # (莊家那個是紅底)。本場與供託**不在這裡**,在 dora_indicators 那塊面板。
  round_info: [0.4142, 0.2948, 0.1750, 0.2000]

  # 四家牌河的網格四角(左上、右上、右下、左下,依畫面上的視覺順序)。
  #
  # 上面那些 river 矩形只框出「牌河大概在哪」,切不出「第幾張捨牌在哪一格」。
  # 牌河是 6x3 的網格,而斜視角讓它在畫面上變成梯形 —— 上家與下家的還是斜的
  # —— 用矩形等分會愈往邊緣偏愈多。四個角就夠了:平面矩形投影後必定仍是四邊形,
  # 單應變換能算出全部 18 格,還能把每格反扭回正矩形,四家共用一套牌面模板。
  #
  # 這個**不能自動偵測**。試過凸包多邊形逼近、四邊包絡線加穩健迴歸,四家都對
  # 不準 —— 不是演算法的問題,是參考畫面裡沒有任何一個牌河是滿的 18 格,右下角
  # 那格從沒被填過,「右邊界的下段」與「下邊界的右段」兩條資料同時缺席,任何
  # 方法都只是在對不存在的資料外推。人眼反而毫無困難,所以改用
  # tools/grid_annotate.py 拖四個角,即時看 6x3 網格疊在畫面上調到格線壓在牌縫。
  #
  # 上家與下家的「一列 6 張」在畫面上是**垂直**方向(他們坐在左右兩側,牌河跟著
  # 轉了 90 度),Grid 會依座位把四個角轉到正確的軸,見 vision/grid.py。
  river_grid:
    own:
      - [0.40053, 0.50329]
      - [0.59257, 0.50206]
      - [0.59601, 0.68621]
      - [0.39480, 0.68744]
    kamicha:
      - [0.29062, 0.26954]
      - [0.40528, 0.26914]
      - [0.39414, 0.49079]
      - [0.26878, 0.49160]
    toimen:
      - [0.42150, 0.14285]
      - [0.57990, 0.14285]
      - [0.58487, 0.26548]
      - [0.41710, 0.26548]
    shimocha:
      - [0.59129, 0.26965]
      - [0.70524, 0.27345]
      - [0.72811, 0.49731]
      - [0.60155, 0.49503]
